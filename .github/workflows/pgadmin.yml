name: autotests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  data_test:
    runs-on: ubuntu-latest
    container: python:3.12

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup tests deps
        run: |
          pip install pytest==8.3.5 pandas==2.2.3 numpy==1.26.4

      - name: Run tests
        run: |
          pytest -v tests
